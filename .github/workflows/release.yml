name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-binaries:
    name: Build Release Binaries
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Compose
      uses: docker/setup-buildx-action@v3

    - name: Run Docker Compose
      run: |
        docker compose up -d
        docker ps

    - name: Build all platform binaries
      run: |
        # Get container ID using compose project label for reliability
        CONTAINER_ID=$(docker compose ps -q | head -n 1)
        if [ -z "$CONTAINER_ID" ]; then
          echo "Error: No running containers found from docker compose"
          exit 1
        fi

        echo "Using container: $CONTAINER_ID"

        # Track build failures
        BUILD_FAILED=0

        echo "Building Darwin ARM64..."
        if ! docker exec $CONTAINER_ID /bin/bash -c "./scripts/build-darwin-arm64.sh"; then
          echo "Error: Darwin ARM64 build failed"
          BUILD_FAILED=1
        fi

        echo "Building Linux AMD64..."
        if ! docker exec $CONTAINER_ID /bin/bash -c "./scripts/build-linux-amd64.sh"; then
          echo "Error: Linux AMD64 build failed"
          BUILD_FAILED=1
        fi

        echo "Building Linux ARM64..."
        if ! docker exec $CONTAINER_ID /bin/bash -c "./scripts/build-linux-arm64.sh"; then
          echo "Error: Linux ARM64 build failed"
          BUILD_FAILED=1
        fi

        echo "Building Windows AMD64..."
        if ! docker exec $CONTAINER_ID /bin/bash -c "./scripts/build-windows-amd64.sh"; then
          echo "Error: Windows AMD64 build failed"
          BUILD_FAILED=1
        fi

        docker compose down

        if [ $BUILD_FAILED -eq 1 ]; then
          echo "One or more builds failed"
          exit 1
        fi

        echo "All builds completed successfully"

    - name: Create release archives
      run: |
        mkdir -p release-assets

        echo "Creating release archives..."
        zip -j release-assets/flows2fim-windows-amd64.zip builds/windows-amd64/flows2fim.exe
        tar -czvf release-assets/flows2fim-darwin-arm64.tar.gz -C builds/darwin-arm64 flows2fim
        tar -czvf release-assets/flows2fim-linux-amd64.tar.gz -C builds/linux-amd64 flows2fim
        tar -czvf release-assets/flows2fim-linux-arm64.tar.gz -C builds/linux-arm64 flows2fim

        echo "Release assets created:"
        ls -lh release-assets/

    - name: Generate checksums
      run: |
        cd release-assets
        sha256sum *.tar.gz *.zip > checksums.txt
        echo "Checksums generated:"
        cat checksums.txt

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-assets
        path: release-assets/*
        retention-days: 1

  build-container:
    name: Build and Push Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract version info
      id: version
      run: |
        # Handle both tag pushes and workflow_dispatch
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          # For workflow_dispatch, use latest tag or default
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0-dev")
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

        # Check if prerelease
        if [[ "$VERSION" =~ (alpha|beta|rc) ]]; then
          echo "is_prerelease=true" >> $GITHUB_OUTPUT
        else
          echo "is_prerelease=false" >> $GITHUB_OUTPUT
        fi

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
          type=raw,value=latest,enable=${{ steps.version.outputs.is_prerelease == 'false' }}
        # Custom labels - these will be MERGED with auto-generated ones
        labels: |
          org.opencontainers.image.title=flows2fim
          org.opencontainers.image.description=flows2fim image
          org.opencontainers.image.licenses=Apache v2.0
          maintainer=${{ github.repository_owner }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        target: prod
        push: true
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-container]
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download release assets
      uses: actions/download-artifact@v4
      with:
        name: release-assets
        path: release-assets

    - name: Generate release notes
      id: release_notes
      run: |
        # Handle both tag pushes and workflow_dispatch
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          TAG_NAME=${GITHUB_REF#refs/tags/}
        else
          TAG_NAME=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0-dev")
        fi
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        VERSION_NUM=${TAG_NAME#v}  # Remove 'v' prefix if present

        # Check if prerelease
        if [[ "$VERSION_NUM" =~ (alpha|beta|rc) ]]; then
          echo "is_prerelease=true" >> $GITHUB_OUTPUT
        else
          echo "is_prerelease=false" >> $GITHUB_OUTPUT
        fi

        # Get the previous tag
        PREV_TAG=$(git describe --tags --abbrev=0 $TAG_NAME^ 2>/dev/null || echo "")

        # Start building release notes
        echo "# Release $TAG_NAME" > release_notes.md
        echo "" >> release_notes.md

        # Extract changelog section (Keep a Changelog format)
        if [ -f "CHANGELOG.md" ]; then
          echo "## 📝 What's Changed" >> release_notes.md
          echo "" >> release_notes.md

          # Look for version with ## [Version] format (Keep a Changelog standard)
          awk -v version="$VERSION_NUM" '
            BEGIN { found=0; in_section=0 }

            # Match version headers with ## [version] format
            /^## \[/ {
              if (in_section) exit  # Stop at next version

              # Extract version from [version] - YYYY-MM-DD format
              match($0, /\[([^\]]+)\]/, arr)
              if (arr[1]) {
                ver = arr[1]
                # Remove v prefix if present
                gsub(/^v/, "", ver)

                if (ver == version) {
                  found=1
                  in_section=1
                  next  # Skip the header itself
                }
              }
            }

            # Print content if we are in the right section
            in_section {
              # Stop if we hit a new version header (## [)
              if (/^## \[/) exit
              # Skip the bottom link references
              if (/^\[.*\]:/) exit
              print
            }
          ' CHANGELOG.md > changelog_section.tmp

          if [ -s changelog_section.tmp ]; then
            cat changelog_section.tmp >> release_notes.md
            echo "" >> release_notes.md
          else
            echo "ℹ️ No changelog entry found for version $VERSION_NUM in CHANGELOG.md" >> release_notes.md
            echo "" >> release_notes.md
          fi
          rm -f changelog_section.tmp
        fi

        # Add detailed commit history
        if [ -n "$PREV_TAG" ]; then
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "## 🔍 Full Commit History" >> release_notes.md
          echo "" >> release_notes.md
          echo "<details>" >> release_notes.md
          echo "<summary>Click to expand</summary>" >> release_notes.md
          echo "" >> release_notes.md
          git log --pretty=format:"- %s (%h)" $PREV_TAG..$TAG_NAME >> release_notes.md
          echo "" >> release_notes.md
          echo "</details>" >> release_notes.md
          echo "" >> release_notes.md
          
          # Add comparison link
          echo "**Full Diff**: [\`$PREV_TAG...$TAG_NAME\`](https://github.com/${{ github.repository }}/compare/$PREV_TAG...$TAG_NAME)" >> release_notes.md
          echo "" >> release_notes.md
        fi

        # Add asset information
        echo "---" >> release_notes.md
        echo "" >> release_notes.md
        echo "## 📦 Installation" >> release_notes.md
        echo "" >> release_notes.md
        echo "### Download Binaries" >> release_notes.md
        echo "" >> release_notes.md
        echo "| Platform | Architecture | Download |" >> release_notes.md
        echo "|----------|--------------|----------|" >> release_notes.md
        echo "| 🍎 macOS | ARM64 (Apple Silicon) | [\`flows2fim-darwin-arm64.tar.gz\`](https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/flows2fim-darwin-arm64.tar.gz) |" >> release_notes.md
        echo "| 🐧 Linux | AMD64 | [\`flows2fim-linux-amd64.tar.gz\`](https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/flows2fim-linux-amd64.tar.gz) |" >> release_notes.md
        echo "| 🐧 Linux | ARM64 | [\`flows2fim-linux-arm64.tar.gz\`](https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/flows2fim-linux-arm64.tar.gz) |" >> release_notes.md
        echo "| 🪟 Windows | AMD64 | [\`flows2fim-windows-amd64.zip\`](https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/flows2fim-windows-amd64.zip) |" >> release_notes.md
        echo "" >> release_notes.md
        
        echo "### 🐳 Docker/Container" >> release_notes.md
        echo "" >> release_notes.md
        echo "\`\`\`bash" >> release_notes.md
        echo "# Pull the image" >> release_notes.md
        echo "docker pull ghcr.io/${{ github.repository }}:${TAG_NAME#v}" >> release_notes.md
        echo "" >> release_notes.md
        echo "# Or use latest" >> release_notes.md
        echo "docker pull ghcr.io/${{ github.repository }}:latest" >> release_notes.md
        echo "\`\`\`" >> release_notes.md
        echo "" >> release_notes.md
        
        echo "### 🔐 Verification" >> release_notes.md
        echo "" >> release_notes.md
        echo "All release assets include SHA256 checksums for verification:" >> release_notes.md
        echo "" >> release_notes.md
        echo "\`\`\`bash" >> release_notes.md
        echo "# Download checksums file" >> release_notes.md
        echo "curl -LO https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/checksums.txt" >> release_notes.md
        echo "" >> release_notes.md
        echo "# Verify your download" >> release_notes.md
        echo "sha256sum -c checksums.txt" >> release_notes.md
        echo "\`\`\`" >> release_notes.md

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ steps.release_notes.outputs.tag_name }}
        body_path: release_notes.md
        files: |
          release-assets/flows2fim-darwin-arm64.tar.gz
          release-assets/flows2fim-linux-amd64.tar.gz
          release-assets/flows2fim-linux-arm64.tar.gz
          release-assets/flows2fim-windows-amd64.zip
          release-assets/checksums.txt
        draft: false
        prerelease: ${{ steps.release_notes.outputs.is_prerelease == 'true' }}